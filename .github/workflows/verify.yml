name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Astro check
        run: npx -y -p @astrojs/check -p typescript@5 astro-check
      - name: Check scripts
        run: |
          set -e
          for f in scripts/check-*.ts; do
            echo "== $f"
            bun "$f"
          done
      - name: Build
        run: bun run build
